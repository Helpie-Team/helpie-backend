name: CI-CD (develop → Ncloud)

on:
  push:
    branches: [ "develop" ]     # ✅ develop 브랜치에 머지되면 실행
  workflow_dispatch:             # ✅ 수동 실행도 가능

concurrency:
  group: deploy-helpie-backend-develop
  cancel-in-progress: true       # 이전 배포 중이면 취소하고 최신 커밋만 실행

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 리포지토리 코드 체크아웃
      - uses: actions/checkout@v4

      # 2️⃣ JDK 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3️⃣ Gradle 빌드
      - name: Build (Gradle)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # 4️⃣ 빌드된 JAR 파일 경로 찾기
      - name: Find built JAR
        id: artifact
        run: |
          set -e
          git rev-parse HEAD
          ls -l build/libs || true
          JAR=$(ls -1 build/libs/*SNAPSHOT*.jar | grep -v -- '-plain' | head -n1)
          echo "Picked JAR: $JAR"
          sha256sum "$JAR"   
          echo "jar=$JAR" >> $GITHUB_OUTPUT

      # 5️⃣ JAR 파일 업로드 (Actions 내부 임시 저장)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ steps.artifact.outputs.jar }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_DIR:  ${{ secrets.APP_DIR }}
      JAR_NAME: ${{ secrets.JAR_NAME }}
      JAVA_CMD: ${{ secrets.JAVA_CMD }}
    steps:
      # 6️⃣ JAR 다운로드
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./dist

      # 7️⃣ JAR 경로 설정
      - name: Pick jar
        id: pick
        run: |
          set -e
          ls -lt ./dist
          JAR=$(ls -1t ./dist/*.jar | head -n1)                             
          echo "jar=$JAR" >> $GITHUB_OUTPUT
          echo "base=$(basename "$JAR")" >> $GITHUB_OUTPUT

      # 8️⃣ 서버에 JAR 복사 (비밀번호 방식)
      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ./dist/${{ steps.pick.outputs.base }}
          target: ${{ secrets.APP_DIR }}/
          strip_components: 1
          overwrite: true

      # 9️⃣ 서버에서 JAR 이름 고정 + 실행 스크립트 호출
      - name: Rename uploaded file and restart (with verify)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            # 업로드된 파일이 실제 존재하는지 확인
            if [ ! -f "$UP_BASE" ]; then
              echo "Uploaded file not found: $UP_BASE"
              ls -l
              exit 1
            fi

            # 정확히 그 파일만 표준 이름으로 교체
            mv -f "$UP_BASE" "$JAR_NAME"

            # 재시작 스크립트 호출 (start.sh는 서버에 미리 배치되어 있어야 함)
            bash "$APP_DIR/start.sh"
