name: CI-CD (develop → Ncloud)

on:
  push:
    branches: [ "develop" ]      # develop에 머지되면 실행
  workflow_dispatch:              # 수동 실행도 가능

concurrency:
  group: deploy-helpie-backend-develop
  cancel-in-progress: true        # 최신 커밋 우선

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) 코드 체크아웃
      - uses: actions/checkout@v4

      # 2) JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3) 빌드
      - name: Build (Gradle)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # 4) 산출물 경로 획득
      - name: Find built JAR
        id: artifact
        run: |
          set -e
          JAR=$(ls -1 build/libs/*SNAPSHOT*.jar | grep -v -- '-plain' | head -n1)
          echo "Picked JAR: $JAR"
          echo "jar=$JAR" >> $GITHUB_OUTPUT

      # 5) 아티팩트 업로드
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ steps.artifact.outputs.jar }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_DIR:  ${{ secrets.APP_DIR }}     # 예: /root/app
      JAR_NAME: ${{ secrets.JAR_NAME }}    # 예: backend-0.0.1-SNAPSHOT.jar
      JAVA_CMD: ${{ secrets.JAVA_CMD }}    # 예: "java -jar"
    steps:
      # 6) 아티팩트 다운로드
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./dist

      # 7) 업로드할 파일명(베이스네임)까지 확정
      - name: Pick jar
        id: pick
        run: |
          set -e
          JAR=$(ls -1 ./dist/*.jar | head -n1)
          echo "jar=$JAR" >> $GITHUB_OUTPUT
          echo "base=$(basename "$JAR")" >> $GITHUB_OUTPUT
          echo "Picked: $JAR"

      # 8) 서버로 복사 (비밀번호 방식)
      - name: Copy JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ${{ steps.pick.outputs.jar }}
          target: ${{ secrets.APP_DIR }}/
          overwrite: true

      # 9) "방금 올린 그 파일"만 정확히 교체 → 재기동
      - name: Rename EXACT uploaded file and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR:  ${{ secrets.APP_DIR }}
          JAR_NAME: ${{ secrets.JAR_NAME }}
          JAVA_CMD: ${{ secrets.JAVA_CMD }}
          UP_BASE:  ${{ steps.pick.outputs.base }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            # 업로드된 파일이 실제 존재하는지 확인
            if [ ! -f "$UP_BASE" ]; then
              echo "Uploaded file not found: $UP_BASE"
              ls -l
              exit 1
            fi

            # 정확히 그 파일만 표준 이름으로 교체
            mv -f "$UP_BASE" "$JAR_NAME"

            # 재시작 스크립트 호출 (start.sh는 서버에 미리 배치되어 있어야 함)
            bash "$APP_DIR/start.sh"
