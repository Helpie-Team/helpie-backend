name: CI-CD (develop → Ncloud)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

concurrency:
  group: deploy-helpie-backend-develop
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build (Gradle)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      # ✅ 실행 가능한 최신 boot JAR만 선택
      - name: Find built JAR (exclude plain, newest)
        id: artifact
        run: |
          set -e
          git rev-parse HEAD
          ls -l build/libs || true
          JAR=$(ls -1t build/libs/*.jar | grep -v -- '-plain' | head -n1)
          echo "Picked JAR: $JAR"
          sha256sum "$JAR"
          echo "jar=$JAR" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ steps.artifact.outputs.jar }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./dist

      # ✅ dist 안에서 최신 파일을 고르고, 파일명만 뽑아둠
      - name: Pick jar (newest)
        id: pick
        run: |
          set -e
          ls -lt ./dist
          JAR=$(ls -1t ./dist/*.jar | head -n1)
          echo "jar=$JAR" >> $GITHUB_OUTPUT
          echo "base=$(basename "$JAR")" >> $GITHUB_OUTPUT

      # ✅ dist/ 폴더 벗겨서 서버로 업로드
      - name: Copy JAR to server (strip dist/)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ./dist/${{ steps.pick.outputs.base }}
          target: ${{ secrets.APP_DIR }}/
          strip_components: 1
          overwrite: true

      # ✅ 원격에서는 변수 쓰지 말고 값 “직접 치환”
      - name: Rename uploaded file and restart (verify)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_DIR }}"
      
            echo "[DEBUG] Current dir:"; ls -l
            if [ ! -f "${{ steps.pick.outputs.base }}" ]; then
            echo "[ERROR] Uploaded file not found: ${{ steps.pick.outputs.base }}"
            exit 1
            fi
      
            if [ "${{ steps.pick.outputs.base }}" != "${{ secrets.JAR_NAME }}" ]; then
            echo "[INFO] mv ${{ steps.pick.outputs.base }} -> ${{ secrets.JAR_NAME }}"
            mv -f "${{ steps.pick.outputs.base }}" "${{ secrets.JAR_NAME }}"
            else
            echo "[INFO] Uploaded name already equals target (${ { secrets.JAR_NAME } }), skip mv"
            fi
      
            [ -x "./start.sh" ] || chmod +x ./start.sh
            bash ./start.sh
      
            echo "[INFO] Running process:"
            pgrep -af "java .*${PWD}/.*\.jar" || true
